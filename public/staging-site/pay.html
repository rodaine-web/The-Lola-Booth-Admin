<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Secure Payment | The LOLA Booth</title><link rel="icon" href="/favicon.png"><style>
:root{--ivory:#fbf7f1;--gold:#b38c52;--ink:#161412;--muted:#6e665e;--line:#dfd3c5}*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.shell{max-width:900px;margin:auto;padding:28px 16px 80px}.head{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:28px}.logo{width:130px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;margin-bottom:18px}.eyebrow{color:var(--gold);font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:400}h1{font-size:42px;margin:8px 0}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{padding:16px;border:1px solid var(--line);border-radius:12px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;font-size:20px;margin-top:5px}.choice{display:flex;gap:10px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;margin:10px 0;cursor:pointer}.choice input{width:18px;height:18px}.choice b{display:block}.choice span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.custom{display:none;margin:10px 0}.custom input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}.btn{width:100%;padding:14px;border:0;border-radius:999px;background:var(--gold);color:#fff;font-weight:700;cursor:pointer;font-size:15px}.btn:disabled{opacity:.5}.providers{display:flex;gap:8px;margin:12px 0}.provider{padding:8px 12px;border:1px solid var(--line);border-radius:999px;font-size:12px}.status{margin-top:12px;color:var(--muted)}.error{color:#9c2f2f}@media(max-width:650px){.summary{grid-template-columns:1fr}.head{align-items:flex-start}h1{font-size:34px}}
</style></head><body><script src="/config.js"></script><main class="shell"><div class="head"><a href="/"><img class="logo" src="/assets/LOLA_Primary_Dark_Transparent.webp" alt="The LOLA Booth"></a><span>Secure payment</span></div><section class="card"><div class="eyebrow">Invoice</div><h1 id="title">Loading…</h1><p id="event"></p><div class="summary"><div class="metric"><span>Invoice total</span><strong id="total">—</strong></div><div class="metric"><span>Deposit due now</span><strong id="deposit">—</strong></div><div class="metric"><span>Remaining balance</span><strong id="balance">—</strong></div></div></section><section class="card" id="paymentCard" hidden><div class="eyebrow">Choose payment amount</div><h2>How much would you like to pay?</h2><label class="choice" id="depositChoice"><input type="radio" name="amount" value="DEPOSIT"><div><b>Pay deposit</b><span id="depositLabel"></span></div></label><label class="choice" id="fullChoice"><input type="radio" name="amount" value="FULL"><div><b>Pay remaining balance</b><span id="fullLabel"></span></div></label><label class="choice"><input type="radio" name="amount" value="CUSTOM"><div><b>Other amount</b><span>Choose an amount between the required minimum and the outstanding balance.</span></div></label><div class="custom" id="customBox"><input type="number" id="customAmount" min="0" step="0.01" placeholder="Enter amount"></div><div class="providers" id="providers"></div><button class="btn" id="pay">Continue to secure payment</button><div class="status" id="status"></div></section></main><script>
(()=>{"use strict";const API=String(window.LOLA_CONFIG?.apiBase||"").replace(/\/$/,"");const params=new URLSearchParams(location.search);const token=params.get("token")||location.pathname.split("/").filter(Boolean).pop();const returnedSuccess=params.get("payment")==="success";const money=(v,c="USD")=>new Intl.NumberFormat("en-US",{style:"currency",currency:c}).format(Number(v||0));let data=null;const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function fetchInvoice(){const r=await fetch(API+"/api/public/invoices/"+encodeURIComponent(token),{cache:"no-store"});if(!r.ok)throw new Error("This payment link is unavailable or has expired.");return r.json()}async function load(){try{data=await fetchInvoice();if(returnedSuccess){for(let n=0;n<5&&data.paymentOptions?.payable;n++){await sleep(900);data=await fetchInvoice()}}const i=data.invoice,o=data.paymentOptions,c=o.currency||"USD";document.getElementById("title").textContent=i.invoice_number;document.getElementById("event").textContent=[i.event_name,i.event_date].filter(Boolean).join(" · ");document.getElementById("total").textContent=money(i.total,c);document.getElementById("deposit").textContent=o.depositAvailable?money(o.amountDue,c):"Satisfied";document.getElementById("balance").textContent=money(o.fullAmount,c);document.getElementById("depositLabel").textContent=money(o.amountDue,c)+" due now";document.getElementById("fullLabel").textContent=money(o.fullAmount,c)+" remaining";document.getElementById("customAmount").min=o.minimumAmount;document.getElementById("customAmount").max=o.fullAmount;document.getElementById("providers").innerHTML=(o.providers||[]).map(p=>'<span class="provider">'+p.label+"</span>").join("");const depositChoice=document.getElementById("depositChoice"),fullChoice=document.getElementById("fullChoice"),paymentCard=document.getElementById("paymentCard"),status=document.getElementById("status"),pay=document.getElementById("pay");depositChoice.style.display=o.depositAvailable?"flex":"none";const first=o.depositAvailable?depositChoice.querySelector("input"):fullChoice.querySelector("input");first.checked=true;paymentCard.hidden=false;if(returnedSuccess){paymentCard.innerHTML='<div class="eyebrow">Payment complete</div><h2>Thank you for your payment.</h2><p>Your payment has been submitted successfully. You can close this page.</p>';return}if(!o.payable||!(o.providers||[]).length){pay.disabled=true;status.textContent=o.payable?"Online payment is not currently available for this invoice.":"No further payment is due on this invoice."}}catch(e){document.getElementById("title").textContent="Payment link unavailable";document.getElementById("event").textContent=e.message}}document.querySelectorAll('input[name="amount"]').forEach(r=>r.addEventListener("change",()=>{document.getElementById("customBox").style.display=r.value==="CUSTOM"&&r.checked?"block":"none"}));document.getElementById("pay").onclick=async()=>{const selected=document.querySelector('input[name="amount"]:checked');if(!selected)return;const choice=selected.value,custom=Number(document.getElementById("customAmount").value||0),provider=data.paymentOptions.providers?.[0]?.provider;if(!provider)return;const btn=document.getElementById("pay"),status=document.getElementById("status");btn.disabled=true;status.textContent="Preparing secure checkout…";try{const payload={provider,amountChoice:choice,idempotencyKey:crypto.randomUUID()};if(choice==="CUSTOM")payload.customAmount=custom;const r=await fetch(API+"/api/public/invoices/"+encodeURIComponent(token)+"/payment-session",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw new Error(d?.error?.message||"Could not start payment.");location.href=d.checkoutUrl}catch(e){status.textContent=e.message;status.className="status error";btn.disabled=false}};load()})();
</script></body></html>
