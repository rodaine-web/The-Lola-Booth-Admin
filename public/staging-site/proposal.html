<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Your LOLA Proposal</title><link rel="icon" href="/favicon.png"><style>
:root{--ivory:#fbf7f1;--gold:#b38c52;--ink:#161412;--muted:#6e665e;--line:#dfd3c5}*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.bar{position:sticky;top:0;z-index:5;background:rgba(251,247,241,.97);border-bottom:1px solid var(--line)}.barin{max-width:1180px;margin:auto;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{width:110px;height:56px;object-fit:contain}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--ink);border-radius:999px;padding:10px 15px;background:#fff;color:var(--ink);text-decoration:none;font-weight:700;cursor:pointer}.gold{background:var(--gold);border-color:var(--gold);color:#fff}.status{max-width:1100px;margin:12px auto;padding:0 16px;color:var(--muted)}.viewer{max-width:1100px;margin:0 auto 110px;padding:0 14px}.wrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.wrap iframe{display:block;width:100%;min-height:1500px;border:0}.accept{display:none;max-width:1100px;margin:16px auto 100px;padding:0 14px}.acceptin{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}.acceptin h2{font:30px Georgia;margin:0 0 10px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row label{display:grid;gap:6px;flex:1;min-width:240px}.row input{padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}.notice{margin-top:8px}.error{color:#9c2f2f}.success{color:#2c6b47}@media(max-width:700px){.wrap{border-radius:0}.viewer{padding:0}.actions .hide-mobile{display:none}}
</style></head><body>
<script src="/config.js"></script>
<header class="bar"><div class="barin"><a href="/"><img class="logo" src="/assets/LOLA_Primary_Dark_Transparent.webp" alt="The LOLA Booth"></a><div class="actions"><a class="btn hide-mobile" href="mailto:info@thelolabooth.com">Ask a Question</a><a class="btn" id="download" href="#">Download PDF</a><button class="btn gold" id="acceptTop" disabled>Accept Proposal</button></div></div></header>
<div class="status" id="status">Loading proposal…</div><main class="viewer"><div class="wrap"><iframe id="frame" title="LOLA proposal"></iframe></div></main>
<section class="accept" id="accept"><div class="acceptin"><h2>Ready to make it official?</h2><p id="copy">Enter your full name to accept this proposal.</p><div class="row"><label>Full name<input id="name" autocomplete="name"></label><button class="btn gold" id="acceptBtn">Accept Proposal</button></div><div class="notice" id="notice"></div></div></section>
<script>
(()=>{"use strict";const API=String(window.LOLA_CONFIG?.apiBase||"").replace(/\/$/,"");const token=new URLSearchParams(location.search).get("token")||location.pathname.split("/").filter(Boolean).pop();const status=document.getElementById("status"),frame=document.getElementById("frame"),download=document.getElementById("download"),accept=document.getElementById("accept"),name=document.getElementById("name"),notice=document.getElementById("notice"),buttons=[document.getElementById("acceptTop"),document.getElementById("acceptBtn")];let proposal=null;function enabled(){return proposal&&["SENT","VIEWED"].includes(proposal.status)}function update(){const ok=enabled();accept.style.display=ok?"block":"none";buttons.forEach(b=>b.disabled=!ok);if(proposal?.status==="ACCEPTED"){status.textContent="This proposal has been accepted.";status.className="status success"}}async function load(){try{if(!API||!token)throw new Error("This proposal link is incomplete.");const [a,b]=await Promise.all([fetch(API+"/api/public/proposals/"+encodeURIComponent(token),{cache:"no-store"}),fetch(API+"/api/public/proposals/"+encodeURIComponent(token)+"/preview",{cache:"no-store"})]);if(!a.ok||!b.ok)throw new Error("This proposal is unavailable or the secure link has expired.");const data=await a.json();proposal=data.proposal;if(data.acceptanceWording)document.getElementById("copy").textContent=data.acceptanceWording;frame.onload=()=>{const d=frame.contentDocument;if(!d)return;frame.style.height=Math.max(d.documentElement.scrollHeight,d.body.scrollHeight,1500)+8+"px";d.querySelectorAll('a[href="#accept"]').forEach(link=>link.onclick=e=>{e.preventDefault();accept.scrollIntoView({behavior:"smooth"});name.focus()})};frame.srcdoc=await b.text();download.href=API+"/api/public/proposals/"+encodeURIComponent(token)+"/pdf";status.textContent=[proposal.proposal_number,proposal.event_name||proposal.event_type,proposal.status].filter(Boolean).join(" · ");update();if(new URLSearchParams(location.search).get("download")==="pdf")location.assign(download.href)}catch(e){status.textContent=e.message;status.className="status error";frame.style.display="none"}}async function doAccept(){if(!enabled())return;if(!name.value.trim()){notice.textContent="Please enter your full name.";notice.className="notice error";return}buttons.forEach(b=>b.disabled=true);try{const r=await fetch(API+"/api/public/proposals/"+encodeURIComponent(token)+"/accept",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({acceptedByName:name.value.trim()})});const d=await r.json();if(!r.ok)throw new Error(d?.error?.message||"Could not accept proposal.");proposal={...proposal,...d.proposal,status:"ACCEPTED"};notice.textContent="Accepted. The LOLA team has been notified and will send your deposit invoice next.";notice.className="notice success";update()}catch(e){notice.textContent=e.message;notice.className="notice error";buttons.forEach(b=>b.disabled=false)}}document.getElementById("acceptTop").onclick=()=>{accept.scrollIntoView({behavior:"smooth"});name.focus()};document.getElementById("acceptBtn").onclick=doAccept;load()})();
</script></body></html>
