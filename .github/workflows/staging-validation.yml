name: Staging Validation

on:
  push:
    branches:
      - main-staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install canvas native binding
        run: npm install --no-save @napi-rs/canvas-linux-x64-gnu@1.0.9

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build
