name: Staging Validation

on:
  pull_request:
    branches:
      - main-staging
  push:
    branches:
      - main-staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lola_test
          POSTGRES_PASSWORD: lola_test
          POSTGRES_DB: lola_v11_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lola_test -d lola_v11_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install canvas native binding
        run: npm install --no-save @napi-rs/canvas-linux-x64-gnu@1.0.9

      - name: Run tests
        run: npm test

      - name: Version 1.1 database lifecycle
        env:
          V11_TEST_DATABASE_URL: postgresql://lola_test:lola_test@localhost:5432/lola_v11_test
        run: node --test --test-concurrency=1 test/contracts-db.test.js test/v11-migration-db.test.js test/v11-http-db.test.js

      - name: Production build
        run: npm run build

      - name: Install browser for customer journey
        run: npx playwright install --with-deps chromium

      - name: Version 1.1 browser journey
        env:
          V11_TEST_DATABASE_URL: postgresql://lola_test:lola_test@localhost:5432/lola_v11_test
          V11_BROWSER_TEST: "true"
        run: node --test test/v11-http-db.test.js

      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v11-browser-evidence
          path: artifacts/v11-browser/
          if-no-files-found: ignore
